services:
  - type: web
    name: volt-solutions
    runtime: docker
    plan: free
    healthCheckPath: /up
    # Free plan: SQLite and uploaded images live on the container disk and are
    # wiped on every deploy/restart. To keep them, switch to a paid plan and add:
    #   disk: { name: data, mountPath: /var/data, sizeGB: 1 }
    # and set DATA_DIR=/var/data
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
